[project]
name = "ultron"
version = "1.0.0"
description = "ULTRON: Autonomous Personal Voice & Vision Assistant for PC and Phone"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "openai>=1.30.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0,<2.0.0",
    "edge-tts>=6.1.12",
    "requests>=2.31.0",
    "pyautogui>=0.9.54",
    "pywinauto>=0.6.8",
    "psutil>=5.9.8",
    "rich>=13.7.1",
    "faster-whisper>=1.0.2",
    "noisereduce>=3.0.0",
    "scipy>=1.11.0",
    "opencv-python>=4.9.0.80",
    "mediapipe>=0.10.14",
    "pvporcupine>=3.0.4",
    "screeninfo>=0.8.1",
    "keyboard>=0.13.5",
]

[project.optional-dependencies]
elevenlabs = ["elevenlabs>=1.0.0"]
openwakeword = ["openwakeword>=0.6.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

